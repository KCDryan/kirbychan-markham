# NOT read by Cloudflare. Deliberately named wrangler.example.toml.
#
# When a real wrangler.toml sits in the repo root, Cloudflare Pages switches to
# reading build configuration from that file instead of from the dashboard and
# a Pages build command cannot be expressed there. The result is the build step
# being skipped entirely:
#
#   Found wrangler.toml file. Reading build configuration...
#   No build command specified. Skipping build step.
#   Error: Output directory "dist" not found.
#
# So the live project is configured in the Cloudflare dashboard:
#   Build command:           npm run build
#   Build output directory:  dist
#
# This file is here only for local emulation of the Pages Function. To use it:
#   cp wrangler.example.toml wrangler.toml
#   npm run build && npx wrangler pages dev dist
# Then delete wrangler.toml again before committing.
name = "kirbychanmarkham"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"
